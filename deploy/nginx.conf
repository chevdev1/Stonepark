# STONEPARK: nginx for a VPS.  Replace stonepark.example with your domain.
# 1) copy to /etc/nginx/sites-available/stonepark and link it into sites-enabled
# 2) sudo nginx -t && sudo systemctl reload nginx
# 3) HTTPS: sudo certbot --nginx -d stonepark.example -d www.stonepark.example
server {
    listen 80;
    listen [::]:80;
    server_name stonepark.example www.stonepark.example;

    root /var/www/stonepark/web;
    index index.html;

    # compression for text; images, audio and video are already compressed
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # backend: live sync (WebSocket), uploads, uploaded files
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 13m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # the page itself: always revalidate, so a deploy shows up at once
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # code: short cache (file names have no version hash)
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public" always;
    }

    # media: long cache; nginx serves byte ranges, so video seeking works
    location ~* \.(png|jpe?g|webp|gif|svg|ico|mp3|mp4|webm|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

}
